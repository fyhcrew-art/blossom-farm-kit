# Builds GADS-drag.exe: upstream GADS at the pinned commit + patch/provider-drag.patch,
# for Windows x64, WITHOUT the hub web interface (hub-ui is proprietary and is
# not part of this build; the kit uses this binary as the provider only).
#
# Runs on a tag "gads-v*" (builds and publishes a release) or by hand
# (builds; publishes only when asked). The build is reproducible: the result
# must have the SHA-256 pinned in versions.json, otherwise the job fails.
name: Build GADS-drag

on:
  push:
    tags:
      - 'gads-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release for the tag in versions.json (the tag must not exist yet)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-gads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.pins.outputs.release_tag }}
      version: ${{ steps.pins.outputs.version }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: kit

      - name: Read the pins from versions.json
        id: pins
        working-directory: kit
        run: |
          set -euo pipefail
          {
            echo "upstream_commit=$(jq -er .gads.commit versions.json)"
            echo "upstream_tag=$(jq -er .gads.version versions.json)"
            echo "release_tag=$(jq -er .gadsDrag.releaseTag versions.json)"
            echo "version=$(jq -er .gadsDrag.version versions.json)"
            echo "sha256=$(jq -er .gadsDrag.sha256 versions.json)"
            echo "go_version=$(jq -er .gadsDrag.goVersion versions.json)"
            echo "swag_version=$(jq -er .gadsDrag.swagVersion versions.json)"
          } >> "$GITHUB_OUTPUT"

      - name: The pushed tag must be the one in versions.json
        if: github.event_name == 'push'
        env:
          PUSHED: ${{ github.ref_name }}
          PINNED: ${{ steps.pins.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$PUSHED" != "$PINNED" ]; then
            echo "::error::Tag $PUSHED was pushed, but versions.json names $PINNED. Update versions.json (gadsDrag.releaseTag, version, url) in the commit you tag."
            exit 1
          fi

      - name: Check out upstream GADS at the pinned commit
        env:
          COMMIT: ${{ steps.pins.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          git init -q gads
          cd gads
          git remote add origin https://github.com/shamanec/GADS.git
          git -c protocol.version=2 fetch -q --depth 1 --no-tags origin "$COMMIT"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"
          # hub-ui is a private, proprietary submodule: it is not fetched and not built.
          test -z "$(ls -A hub-ui 2>/dev/null)"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.pins.outputs.go_version }}
          cache: false

      - name: Apply the patch
        working-directory: gads
        run: |
          set -euo pipefail
          git apply --check ../kit/patch/provider-drag.patch
          git apply ../kit/patch/provider-drag.patch
          git status --short

      - name: Generate the API docs package (needed to compile, as upstream does)
        working-directory: gads
        env:
          SWAG_VERSION: ${{ steps.pins.outputs.swag_version }}
        run: |
          set -euo pipefail
          go install "github.com/swaggo/swag/cmd/swag@${SWAG_VERSION}"
          "$(go env GOPATH)/bin/swag" init -g hub/hub.go -o docs

      - name: Build for Windows x64
        working-directory: gads
        env:
          VERSION: ${{ steps.pins.outputs.version }}
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
          GOFLAGS: ''
        run: |
          set -euo pipefail
          mkdir -p ../dist
          # No "-tags ui": the proprietary web interface is not embedded.
          go build -trimpath -buildvcs=false -ldflags="-X main.AppVersion=${VERSION}" -o ../dist/GADS-drag.exe .
          ls -l ../dist

      - name: Vet and test the provider packages (the patch only touches provider/router)
        working-directory: gads
        run: |
          set -euo pipefail
          go vet ./provider/router/
          go test ./provider/...

      - name: Source archive (the AGPL requires offering the source of what is published)
        env:
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          cp kit/patch/provider-drag.patch gads/provider-drag.patch
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2020-01-01 00:00:00Z' \
              --exclude=.git -czf "dist/GADS-drag-${VERSION}-source.tar.gz" gads

      - name: Checksums, and the reproducibility check
        env:
          PINNED: ${{ steps.pins.outputs.sha256 }}
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum GADS-drag.exe GADS-drag-*-source.tar.gz | tee SHA256SUMS
          BUILT="$(sha256sum GADS-drag.exe | cut -d' ' -f1)"
          if [ "$BUILT" != "$PINNED" ]; then
            echo "::error::GADS-drag.exe has SHA-256 $BUILT but versions.json pins $PINNED. If the patch, the upstream commit, the Go version or the swag version changed, put the new value into versions.json (gadsDrag.sha256) and tag again. If nothing changed, do not publish: find out why the build differs."
            exit 1
          fi
          echo "Reproduced the pinned SHA-256."

      - name: Keep the result for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gads-drag
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gads-drag
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          cat > notes.md <<NOTES
          GADS provider with the Blossom patch, for Windows x64 (${VERSION}).

          * Built by this repository's workflow from https://github.com/shamanec/GADS plus \`patch/provider-drag.patch\`; the exact upstream commit is in \`versions.json\`.
          * Licence: GNU AGPL v3.0, like the GADS source it is built from. The complete source of this binary is attached (\`GADS-drag-${VERSION}-source.tar.gz\`).
          * It does **not** contain the GADS hub web interface (\`hub-ui\`, proprietary). Use it as the provider only; the hub is the publisher's own release.
          * SHA-256 values are in \`SHA256SUMS\`; the installer of the kit verifies the one pinned in \`versions.json\`.
          NOTES
          gh release create "$TAG" --target "$TARGET" --title "GADS-drag ${VERSION}" --notes-file notes.md \
            GADS-drag.exe SHA256SUMS "GADS-drag-${VERSION}-source.tar.gz"
