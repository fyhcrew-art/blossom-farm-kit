# Builds GADS-drag: upstream GADS at the pinned commit + patch/provider-drag.patch,
# WITHOUT the hub web interface (hub-ui is proprietary and is not part of this
# build; the kit uses this program as the provider only). Three files from
# the same patched source:
#   GADS-drag.exe            Windows x64
#   GADS-drag-darwin-arm64   macOS, Apple Silicon
#   GADS-drag-darwin-amd64   macOS, Intel
# All three are cross-built on Linux with CGO_ENABLED=0 (GADS and the modules
# it uses need no C compiler on any of the three systems).
#
# Runs on a tag "gads-v*" (builds and publishes a release) or by hand
# (builds; publishes only when asked). The build is reproducible: each file
# must have the SHA-256 pinned for it in versions.json, otherwise the job fails.
#
# Nothing is published unless versions.json records the maintainers' decision
# to publish binaries that embed upstream's "resources" folder (Apple's
# developer disk image among it): gadsDrag.redistributeEmbeddedResources must
# be true. See NOTICE, section 2b, and docs/RELEASING.md.
name: Build GADS-drag

on:
  push:
    tags:
      - 'gads-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release for the tag in versions.json (the tag must not exist yet)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-gads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.pins.outputs.release_tag }}
      version: ${{ steps.pins.outputs.version }}
      redistribute: ${{ steps.pins.outputs.redistribute }}
    steps:
      - name: Check out the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: kit

      - name: Read the pins from versions.json
        id: pins
        working-directory: kit
        run: |
          set -euo pipefail
          {
            echo "upstream_commit=$(jq -er .gads.commit versions.json)"
            echo "upstream_tag=$(jq -er .gads.version versions.json)"
            echo "release_tag=$(jq -er .gadsDrag.releaseTag versions.json)"
            echo "version=$(jq -er .gadsDrag.version versions.json)"
            echo "sha256=$(jq -er .gadsDrag.sha256 versions.json)"
            echo "sha256_darwin_arm64=$(jq -er .macos.arm64.provider.sha256 versions.json)"
            echo "sha256_darwin_amd64=$(jq -er .macos.x86_64.provider.sha256 versions.json)"
            echo "go_version=$(jq -er .gadsDrag.goVersion versions.json)"
            echo "swag_version=$(jq -er .gadsDrag.swagVersion versions.json)"
            echo "redistribute=$(jq -r '.gadsDrag.redistributeEmbeddedResources == true' versions.json)"
          } >> "$GITHUB_OUTPUT"

      - name: The pushed tag must be the one in versions.json
        if: github.event_name == 'push'
        env:
          PUSHED: ${{ github.ref_name }}
          PINNED: ${{ steps.pins.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$PUSHED" != "$PINNED" ]; then
            echo "::error::Tag $PUSHED was pushed, but versions.json names $PINNED. Update versions.json (gadsDrag.releaseTag, version, url, and the two macos.*.provider.url) in the commit you tag."
            exit 1
          fi

      - name: Check out upstream GADS at the pinned commit
        env:
          COMMIT: ${{ steps.pins.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          git init -q gads
          cd gads
          git remote add origin https://github.com/shamanec/GADS.git
          git -c protocol.version=2 fetch -q --depth 1 --no-tags origin "$COMMIT"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"
          # hub-ui is a private, proprietary submodule: it is not fetched and not built.
          test -z "$(ls -A hub-ui 2>/dev/null)"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.pins.outputs.go_version }}
          cache: false

      - name: Apply the patch
        working-directory: gads
        run: |
          set -euo pipefail
          git apply --check ../kit/patch/provider-drag.patch
          git apply ../kit/patch/provider-drag.patch
          git status --short

      - name: Generate the API docs package (needed to compile, as upstream does)
        working-directory: gads
        env:
          SWAG_VERSION: ${{ steps.pins.outputs.swag_version }}
        run: |
          set -euo pipefail
          go install "github.com/swaggo/swag/cmd/swag@${SWAG_VERSION}"
          "$(go env GOPATH)/bin/swag" init -g hub/hub.go -o docs

      - name: Build for Windows x64, macOS arm64 and macOS x64
        working-directory: gads
        env:
          VERSION: ${{ steps.pins.outputs.version }}
          CGO_ENABLED: '0'
          GOFLAGS: ''
        run: |
          set -euo pipefail
          mkdir -p ../dist
          # No "-tags ui": the proprietary web interface is not embedded.
          build() { GOOS="$1" GOARCH="$2" go build -trimpath -buildvcs=false -ldflags="-X main.AppVersion=${VERSION}" -o "../dist/$3" .; }
          build windows amd64 GADS-drag.exe
          build darwin arm64 GADS-drag-darwin-arm64
          build darwin amd64 GADS-drag-darwin-amd64
          ls -l ../dist

      - name: Vet and test the provider packages (the patch only touches provider/router)
        working-directory: gads
        run: |
          set -euo pipefail
          go vet ./provider/router/
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./provider/router/
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./provider/router/
          go test ./provider/...

      # After the build and its tests on purpose: the script adds vendor/ to the
      # tree, and the published programs are built in module mode, without it.
      - name: Source archive, licence texts of the linked modules, the AGPL text
        env:
          VERSION: ${{ steps.pins.outputs.version }}
          UPSTREAM_COMMIT: ${{ steps.pins.outputs.upstream_commit }}
          UPSTREAM_TAG: ${{ steps.pins.outputs.upstream_tag }}
          GO_VERSION: ${{ steps.pins.outputs.go_version }}
          SWAG_VERSION: ${{ steps.pins.outputs.swag_version }}
          GOFLAGS: ''
        run: bash kit/.github/scripts/make-source-archive.sh

      - name: Checksums, and the reproducibility check
        env:
          PINNED_WINDOWS: ${{ steps.pins.outputs.sha256 }}
          PINNED_DARWIN_ARM64: ${{ steps.pins.outputs.sha256_darwin_arm64 }}
          PINNED_DARWIN_AMD64: ${{ steps.pins.outputs.sha256_darwin_amd64 }}
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum GADS-drag.exe GADS-drag-darwin-arm64 GADS-drag-darwin-amd64 GADS-drag-*-source.tar.gz THIRD-PARTY-NOTICES.txt LICENSE-AGPL-3.0.txt | tee SHA256SUMS
          FAILED=0
          check() {
            BUILT="$(sha256sum "$1" | cut -d' ' -f1)"
            if [ "$BUILT" != "$2" ]; then
              echo "::error::$1 has SHA-256 $BUILT but versions.json pins $2 ($3). If the patch, the upstream commit, the Go version or the swag version changed, put the new value into versions.json and tag again. If nothing changed, do not publish: find out why the build differs."
              FAILED=1
            fi
          }
          check GADS-drag.exe "$PINNED_WINDOWS" gadsDrag.sha256
          check GADS-drag-darwin-arm64 "$PINNED_DARWIN_ARM64" macos.arm64.provider.sha256
          check GADS-drag-darwin-amd64 "$PINNED_DARWIN_AMD64" macos.x86_64.provider.sha256
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo "Reproduced the three pinned SHA-256 values."

      - name: Keep the result for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gads-drag
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The decision to publish must be recorded in versions.json
        env:
          REDISTRIBUTE: ${{ needs.build.outputs.redistribute }}
        run: |
          set -euo pipefail
          if [ "$REDISTRIBUTE" != "true" ]; then
            echo "::error::Not published. Every GADS-drag program embeds upstream's 'resources' folder, which holds Apple's developer disk image and other pre-built files. Publishing it makes this repository a distributor of them. Read NOTICE, section 2b, and docs/RELEASING.md (\"Before the first gads release\"); if you decide to publish, set gadsDrag.redistributeEmbeddedResources to true in versions.json in the commit you tag. The build itself succeeded and is kept as a workflow artifact."
            exit 1
          fi

      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gads-drag
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          cat > notes.md <<NOTES
          **This is not the kit.** To set up a farm, download the newest release whose name starts with \`kit-v\`. The kit's installer fetches the file it needs from below by itself.

          GADS provider with the Blossom patch (${VERSION}), built three times from the same source: \`GADS-drag.exe\` for Windows x64, \`GADS-drag-darwin-arm64\` for a Mac with Apple Silicon, \`GADS-drag-darwin-amd64\` for an Intel Mac. A modified version of GADS, not the original.

          * Built by this repository's workflow from https://github.com/shamanec/GADS plus \`patch/provider-drag.patch\`; the exact upstream commit is in \`versions.json\`.
          * Licence: GNU AGPL v3.0, like the GADS source it is built from (\`LICENSE-AGPL-3.0.txt\`).
          * Source: \`GADS-drag-${VERSION}-source.tar.gz\` holds the patched GADS tree, the generated \`docs\` package, the sources of all Go modules it is built from (\`vendor/\`), the patch, \`BUILD.md\` (how this file was built) and \`MODIFICATIONS.md\` (what was changed, and when). One thing is left out and named in the archive with checksums and its upstream address: Apple's developer disk image (\`resources/ios-ddi\`), which the build embeds.
          * \`THIRD-PARTY-NOTICES.txt\`: the licence texts of the Go modules compiled into the three programs.
          * It does **not** contain the GADS hub web interface (\`hub-ui\`, proprietary). Use it as the provider only; the hub is the publisher's own release.
          * SHA-256 values are in \`SHA256SUMS\`; the installers of the kit verify the ones pinned in \`versions.json\`.
          NOTES
          # --latest=false: the "Latest" badge and /releases/latest belong to the
          # tested kit-v releases, never to a provider-only release.
          gh release create "$TAG" --target "$TARGET" --title "GADS-drag ${VERSION}" --notes-file notes.md --latest=false \
            GADS-drag.exe GADS-drag-darwin-arm64 GADS-drag-darwin-amd64 SHA256SUMS "GADS-drag-${VERSION}-source.tar.gz" THIRD-PARTY-NOTICES.txt LICENSE-AGPL-3.0.txt
